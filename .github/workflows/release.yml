name: Release

on:
  workflow_call:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.95.0.'
        required: true
        type: string
      dry_run:
        description: 'Build and verify without publishing.'
        default: true
        type: boolean

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  AUTO: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
    env:
      BEFORE: ${{ github.event.before }}
      REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the requested tag
        if: env.AUTO != 'true'
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTO == 'true' && github.sha || format('refs/tags/{0}', env.REQUESTED_TAG) }}
          fetch-depth: 0
      - name: Identify the release
        id: candidate
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          sha=$(git rev-parse HEAD)
          if [[ "$AUTO" == true ]]; then
            if [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
              previous_properties=$(git show "$BEFORE:gradle.properties")
              previous_version=$(sed -n 's/^mod_version=//p' <<< "$previous_properties")
              if [[ "$previous_version" == "$version" ]]; then
                echo "mod_version is unchanged ($version)"
                exit 0
              fi
            fi
          else
            if [[ "$REQUESTED_TAG" != "v$version" ]]; then
              echo "Tag $REQUESTED_TAG does not match mod_version=$version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "Tagged commit $sha is not on origin/main"
              exit 1
            fi
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid mod_version in gradle.properties"
            exit 1
          fi
          {
            echo "tag=v$version"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
      - name: Require green main CI for an explicit publication
        if: ${{ env.AUTO != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          runs=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$RELEASE_SHA" -f per_page=100 \
            --jq '.workflow_runs[].id')
          for run in $runs; do
            # Automatic publication can fail after the required checks have already passed.
            gate=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "CI gate" and .status == "completed" and .conclusion == "success") | .id')
            if [[ -n "$gate" ]]; then
              echo "CI gate passed for $RELEASE_SHA in run $run"
              exit 0
            fi
          done
          echo "No successful CI gate on a main push for $RELEASE_SHA"
          exit 1

  verify:
    name: Verify release files
    needs: preflight
    if: needs.preflight.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    outputs:
      artifact: ${{ steps.files.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: env.AUTO != 'true'
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Extract release notes
        run: |
          parser=scripts/release-notes.sh
          if [[ "$AUTO" != true ]]; then
            parser="release-tools/$parser"
          fi
          mkdir release-assets
          sh "$parser" "$VERSION" CHANGELOG.md > release-assets/release-notes.md
      - uses: gradle/actions/wrapper-validation@v4
        if: env.AUTO != 'true'
      - uses: actions/setup-java@v6
        if: env.AUTO != 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: env.AUTO != 'true'
      - name: Build and run the full gate
        if: env.AUTO != 'true'
        run: ./gradlew clean build --console=plain --stacktrace
      - uses: actions/download-artifact@v8
        if: env.AUTO == 'true'
        with:
          name: friendai-jar
          path: build/libs
      - name: Verify the jar and write the checksum
        id: files
        shell: bash
        run: |
          jar="friendai-$VERSION.jar"
          scripts/check-release.sh "$TAG" "build/libs/$jar" | tee check-release.txt
          checksum=$(sed -n 's/^sha256=//p' check-release.txt)
          mv "build/libs/$jar" release-assets/
          printf '%s  %s\n' "$checksum" "$jar" > "release-assets/$jar.sha256"
          echo "artifact=release-$VERSION-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf '### Verified %s\n\n- SHA-256: %s\n' "$TAG" "$checksum" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.artifact }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ needs.preflight.outputs.version }}-${{ github.run_attempt }}
          path: |
            check-release.txt
            build/libs/
            build/test-results/
            build/reports/
            run/logs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish
    needs: [preflight, verify]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.preflight.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: release-assets
      - name: Check the downloaded release files
        working-directory: release-assets
        run: |
          sha256sum --check "friendai-$VERSION.jar.sha256"
          test -s release-notes.md
      - name: Pin the tag to the verified commit
        run: |
          ref="refs/tags/$TAG"
          remote_tag=$(git ls-remote origin "$ref")
          if [[ -z "$remote_tag" ]]; then
            if [[ "$AUTO" != true ]]; then
              echo "Tag $TAG is missing"
              exit 1
            fi
            git push origin "$RELEASE_SHA:$ref"
          fi
          git fetch --no-tags origin "$ref"
          tagged_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $TAG points to $tagged_sha instead of $RELEASE_SHA"
            exit 1
          fi
      - name: Publish the verified release
        working-directory: release-assets
        run: |
          jar="friendai-$VERSION.jar"
          flags=(--verify-tag --title "$TAG" --notes-file release-notes.md)
          git fetch --no-tags origin refs/heads/main
          main_properties=$(git show FETCH_HEAD:gradle.properties)
          main_version=$(sed -n 's/^mod_version=//p' <<< "$main_properties")
          if [[ "$VERSION" != "$main_version" ]]; then
            flags+=(--latest=false)
          fi
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" == false ]]; then
              echo "Release $TAG is already published"
              exit 0
            fi
            gh release upload "$TAG" "$jar" "$jar.sha256" --clobber
            gh release edit "$TAG" "${flags[@]}" --draft=false
          else
            gh release create "$TAG" "$jar" "$jar.sha256" "${flags[@]}"
          fi
      - name: Summarize the release
        run: |
          printf '### Release %s\n\n%s/%s/releases/tag/%s\n' \
            "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
